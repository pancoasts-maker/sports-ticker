<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Sports Dashboard & Overlay Ticker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Embedded YouTube Player Viewport */
    .viewer-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
    }

    /* Top Control Bar */
    .top-controls {
      position: absolute;
      top: 10px;
      right: 15px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .top-controls input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      width: 260px;
    }

    .ctrl-btn {
      background: #aa0000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }

    .ctrl-btn.secondary {
      background: #1e293b;
      border: 1px solid #475569;
    }

    /* Bottom Ticker Bar */
    .ticker-wrapper {
      height: 75px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      line-height: 75px;
      overflow: hidden;
      border-top: 4px solid #aa0000;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
      cursor: pointer;
    }

    .ticker-content {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding-left: 100%;
      animation: scroll-ticker 55s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      font-weight: 800;
      letter-spacing: 0.8px;
      font-size: 24px;
      padding: 0 16px;
    }

    /* 49ers Highlight Box */
    .ticker-item.niners-game {
      background: rgba(170, 0, 0, 0.45);
      border: 2px solid #B3995D;
      border-radius: 8px;
      padding: 4px 20px;
      margin: 0 10px;
    }

    /* Philadelphia Phillies Highlight Box */
    .ticker-item.phillies-game {
      background: rgba(231, 15, 60, 0.35);
      border: 2px solid #E70F3C;
      border-radius: 8px;
      padding: 4px 20px;
      margin: 0 10px;
    }

    /* St. Louis Blues Highlight Box */
    .ticker-item.blues-game {
      background: rgba(0, 47, 108, 0.55);
      border: 2px solid #FCB514;
      border-radius: 8px;
      padding: 4px 20px;
      margin: 0 10px;
    }

    /* NFL News Highlight Box */
    .ticker-item.nfl-news {
      background: rgba(30, 41, 59, 0.8);
      border-left: 4px solid #aa0000;
      padding: 4px 16px;
      margin: 0 8px;
    }

    .team-logo {
      height: 40px;
      width: 40px;
      object-fit: contain;
      vertical-align: middle;
      margin: 0 8px;
    }

    .league-tag {
      color: #94a3b8;
      font-size: 18px;
      font-weight: 800;
      margin-right: 10px;
    }

    .news-tag {
      color: #ef4444;
      font-size: 18px;
      font-weight: 800;
      margin-right: 10px;
    }

    .vs-text {
      color: #cbd5e1;
      font-weight: 500;
      margin: 0 8px;
    }

    .game-status {
      color: #38bdf8;
      font-weight: 600;
      font-size: 18px;
      margin-left: 12px;
    }

    .news-text {
      color: #f8fafc;
      font-weight: 600;
      font-size: 20px;
    }

    @keyframes scroll-ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- Controls overlay -->
  <div class="top-controls">
    <input type="text" id="ytUrlInput" placeholder="Paste YouTube Video / Live URL...">
    <button class="ctrl-btn" onclick="loadCustomUrl()">Load Stream</button>
    <button class="ctrl-btn secondary" onclick="toggleFullscreen()">Fullscreen</button>
  </div>

  <div class="app-viewport">
    <!-- Embedded YouTube Player Endpoint -->
    <iframe 
      id="mainFrame" 
      class="viewer-frame" 
      src="https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig" 
      allow="fullscreen; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>

    <!-- Scrolling Sports Ticker Bar -->
    <div class="ticker-wrapper" onclick="toggleFullscreen()">
      <div class="ticker-content" id="ticker">Loading live sports scores & NFL news...</div>
    </div>
  </div>

  <script>
    function loadCustomUrl() {
      const input = document.getElementById('ytUrlInput').value.trim();
      if (!input) return;

      let videoId = input;

      if (input.includes('v=')) {
        videoId = input.split('v=')[1].split('&')[0];
      } else if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      } else if (input.includes('embed/')) {
        videoId = input.split('embed/')[1].split('?')[0];
      }
      
      document.getElementById('mainFrame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    }

    // Live Scores & News Endpoints
    const SCORE_ENDPOINTS = [
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard'
    ];

    const NFL_NEWS_ENDPOINT = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/news';

    async function fetchAllData() {
      const tickerEl = document.getElementById('ticker');
      try {
        const scorePromises = SCORE_ENDPOINTS.map(url => 
          fetch(url).then(res => res.ok ? res.json() : null).catch(() => null)
        );
        const newsPromise = fetch(NFL_NEWS_ENDPOINT).then(res => res.ok ? res.json() : null).catch(() => null);

        const [scoreResults, newsData] = await Promise.all([
          Promise.all(scorePromises),
          newsPromise
        ]);

        let priorityItems = [], standardItems = [], newsItems = [];

        // Parse Live Scores
        scoreResults.forEach(data => {
          if (!data || !data.events) return;
          const league = data.leagues?.[0]?.abbreviation || 'SPORTS';

          data.events.forEach(event => {
            const comp = event.competitions?.[0];
            if (!comp) return;

            const home = comp.competitors?.find(c => c.homeAway === 'home');
            const away = comp.competitors?.find(c => c.homeAway === 'away');
            const status = event.status?.type?.shortDetail || 'Scheduled';

            if (home && away) {
              const homeScore = home.score !== undefined ? home.score : 0;
              const awayScore = away.score !== undefined ? away.score : 0;
              const homeLogo = home.team?.logo || '';
              const awayLogo = away.team?.logo || '';
              
              const isNiners = (home.team?.abbreviation === 'SF' || away.team?.abbreviation === 'SF') && league === 'NFL';
              const isPhillies = (home.team?.abbreviation === 'PHI' || away.team?.abbreviation === 'PHI') && league === 'MLB';
              const isBlues = (home.team?.abbreviation === 'STL' || away.team?.abbreviation === 'STL') && league === 'NHL';

              let highlightClass = '';
              if (isNiners) highlightClass = 'niners-game';
              if (isPhillies) highlightClass = 'phillies-game';
              if (isBlues) highlightClass = 'blues-game';

              const itemHTML = `
                <span class="ticker-item ${highlightClass}">
                  <span class="league-tag">[${league}]</span>
                  ${awayLogo ? `<img src="${awayLogo}" class="team-logo">` : ''}
                  ${away.team.abbreviation} ${awayScore}
                  <span class="vs-text">@</span>
                  ${homeLogo ? `<img src="${homeLogo}" class="team-logo">` : ''}
                  ${home.team.abbreviation} ${homeScore}
                  <span class="game-status">(${status})</span>
                </span>
              `;

              if (isNiners || isPhillies || isBlues) priorityItems.push(itemHTML);
              else standardItems.push(itemHTML);
            }
          });
        });

        // Parse NFL News Headlines
        if (newsData && newsData.articles) {
          newsData.articles.slice(0, 8).forEach(article => {
            if (article.headline) {
              newsItems.push(`
                <span class="ticker-item nfl-news">
                  <span class="news-tag">[NFL HEADLINES]</span>
                  <span class="news-text">${article.headline}</span>
                </span>
              `);
            }
          });
        }

        // Priority order: Team Highlights -> Standard Scores -> NFL News
        const allItems = [...priorityItems, ...standardItems, ...newsItems];
        tickerEl.innerHTML = allItems.length > 0 ? allItems.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ') : 'No sports updates available right now.';
      } catch (err) {
        tickerEl.innerText = 'Unable to connect to live sports feed.';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    fetchAllData();
    setInterval(fetchAllData, 60000);
  </script>
</body>
</html>
