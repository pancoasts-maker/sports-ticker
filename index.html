<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Ticker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      border-top: 3px solid #aa0000;
      -webkit-app-region: drag;
    }

    .ticker-wrapper {
      height: 72px;
      width: 100vw;
      line-height: 72px;
      overflow: hidden;
    }

    .ticker-content {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding-left: 100%;
      animation: scroll-ticker 45s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      font-weight: 800;
      font-size: 20px;
      padding: 0 14px;
      -webkit-app-region: no-drag;
    }

    /* Highlight themes for featured teams */
    .niners-game { background: rgba(170, 0, 0, 0.6); border: 2px solid #B3995D; border-radius: 6px; margin: 0 8px; }
    .phillies-game { background: rgba(231, 15, 60, 0.5); border: 2px solid #E70F3C; border-radius: 6px; margin: 0 8px; }
    .blues-game { background: rgba(0, 47, 108, 0.7); border: 2px solid #FCB514; border-radius: 6px; margin: 0 8px; }
    .fantasy-item { background: rgba(22, 101, 52, 0.6); border: 2px solid #4ade80; border-radius: 6px; margin: 0 8px; }

    .team-logo { height: 32px; width: 32px; margin: 0 8px; vertical-align: middle; }
    .league-tag { color: #94a3b8; font-size: 15px; margin-right: 6px; }
    .vs-text { color: #cbd5e1; margin: 0 6px; }
    .game-status { color: #38bdf8; font-size: 15px; margin-left: 8px; }
    .fantasy-pts { color: #4ade80; margin-left: 6px; }
    .fantasy-pos { color: #94a3b8; font-size: 13px; margin-left: 4px; }
    .fantasy-players { color: #4ade80; font-size: 14px; margin-left: 8px; }

    @keyframes scroll-ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
  </style>
</head>
<body>

  <div class="ticker-wrapper">
    <div class="ticker-content" id="ticker">Loading live sports scores...</div>
  </div>

  <script>
    const SCORE_ENDPOINTS = [
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard'
    ];

    // ESPN Fantasy Football: fill these in to show your team and players.
    // leagueId is the number after "leagueId=" in your league's URL on fantasy.espn.com.
    // teamId is the number after "teamId=" when you open your own team page.
    // Private leagues must be set to "viewable to public" in League Settings (LM only).
    const FANTASY = {
      leagueId: '784043',
      teamId: 2,
      season: new Date().getMonth() < 2 ? new Date().getFullYear() - 1 : new Date().getFullYear()
    };

    const LINEUP_SLOTS = { 0: 'QB', 2: 'RB', 4: 'WR', 6: 'TE', 16: 'D/ST', 17: 'K', 23: 'FLEX' };
    const BENCH_SLOTS = [20, 21];

    const escapeHtml = str => String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtPts = n => (Math.round((n || 0) * 10) / 10).toFixed(1);
    const teamName = t => t?.name || [t?.location, t?.nickname].filter(Boolean).join(' ') || t?.abbrev || 'Team';

    async function fetchFantasy() {
      if (!FANTASY.leagueId || !FANTASY.teamId) return null;
      const base = `https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/${FANTASY.season}/segments/0/leagues/${FANTASY.leagueId}`;
      try {
        const league = await fetch(`${base}?view=mStatus`).then(r => r.ok ? r.json() : null);
        const week = league?.scoringPeriodId;
        const matchupPeriod = league?.status?.currentMatchupPeriod;
        if (!week) return null;

        const d = await fetch(`${base}?view=mTeam&view=mRoster&view=mMatchupScore&scoringPeriodId=${week}`).then(r => r.ok ? r.json() : null);
        const teams = d?.teams || [];
        const myTeam = teams.find(t => t.id === Number(FANTASY.teamId));
        if (!myTeam) return null;

        const matchup = (d.schedule || []).find(m => m.matchupPeriodId === matchupPeriod && (m.home?.teamId === myTeam.id || m.away?.teamId === myTeam.id));
        const mySide = matchup && (matchup.home?.teamId === myTeam.id ? matchup.home : matchup.away);
        const oppSide = matchup && (matchup.home?.teamId === myTeam.id ? matchup.away : matchup.home);
        const opponent = teams.find(t => t.id === oppSide?.teamId);
        const sidePts = side => side?.totalPointsLive ?? side?.totalPoints ?? 0;

        const starters = (myTeam.roster?.entries || [])
          .filter(e => !BENCH_SLOTS.includes(e.lineupSlotId))
          .map(e => {
            const player = e.playerPoolEntry?.player;
            const weekStat = player?.stats?.find(s => s.scoringPeriodId === week && s.statSourceId === 0);
            return {
              name: player?.fullName || 'Player',
              slot: LINEUP_SLOTS[e.lineupSlotId] || '',
              proTeamId: player?.proTeamId,
              points: weekStat?.appliedTotal ?? e.playerPoolEntry?.appliedStatTotal ?? 0
            };
          })
          .sort((a, b) => Object.values(LINEUP_SLOTS).indexOf(a.slot) - Object.values(LINEUP_SLOTS).indexOf(b.slot));

        const rec = myTeam.record?.overall;
        const recordText = rec ? `${rec.wins}-${rec.losses}${rec.ties ? `-${rec.ties}` : ''}` : '';

        const scoreHtml = `
          <span class="ticker-item fantasy-item">
            <span class="league-tag">[FANTASY Wk ${week}]</span>
            ${escapeHtml(teamName(myTeam))}<span class="fantasy-pts">${fmtPts(sidePts(mySide))}</span>
            ${opponent ? `<span class="vs-text">vs</span>${escapeHtml(teamName(opponent))} ${fmtPts(sidePts(oppSide))}` : ''}
            ${recordText ? `<span class="game-status">(${recordText})</span>` : ''}
          </span>
        `;
        const playerHtml = starters.map(p => `
          <span class="ticker-item">
            ${escapeHtml(p.name)}<span class="fantasy-pos">${p.slot}</span><span class="fantasy-pts">${fmtPts(p.points)}</span>
          </span>
        `);

        return { items: [scoreHtml, ...playerHtml], starters };
      } catch (e) {
        return null;
      }
    }

    async function fetchScores() {
      const tickerEl = document.getElementById('ticker');
      try {
        const promises = SCORE_ENDPOINTS.map(u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null));
        const [data, fantasy] = await Promise.all([Promise.all(promises), fetchFantasy()]);

        let priorityGames = [];
        let standardGames = [];

        data.forEach(d => {
          if (!d || !d.events) return;
          const league = d.leagues?.[0]?.abbreviation || 'SPORTS';

          d.events.forEach(event => {
            const comp = event.competitions?.[0];
            if (!comp) return;

            // Handle standard team sports (NFL, MLB, NHL)
            const home = comp.competitors?.find(c => c.homeAway === 'home');
            const away = comp.competitors?.find(c => c.homeAway === 'away');
            const status = event.status?.type?.shortDetail || 'Scheduled';

            if (home && away) {
              const isNiners = (home.team?.abbreviation === 'SF' || away.team?.abbreviation === 'SF') && league === 'NFL';
              const isPhillies = (home.team?.abbreviation === 'PHI' || away.team?.abbreviation === 'PHI') && league === 'MLB';
              const isBlues = (home.team?.abbreviation === 'STL' || away.team?.abbreviation === 'STL') && league === 'NHL';

              let cls = '';
              if (isNiners) cls = 'niners-game';
              if (isPhillies) cls = 'phillies-game';
              if (isBlues) cls = 'blues-game';

              // Flag NFL games featuring your fantasy starters
              const myPlayers = league === 'NFL' && fantasy
                ? fantasy.starters.filter(p => String(p.proTeamId) === String(home.team?.id) || String(p.proTeamId) === String(away.team?.id))
                : [];

              const html = `
                <span class="ticker-item ${cls}">
                  <span class="league-tag">[${league}]</span>
                  ${away.team?.logo ? `<img src="${away.team.logo}" class="team-logo">` : ''}
                  ${away.team.abbreviation} ${away.score || 0}
                  <span class="vs-text">@</span>
                  ${home.team?.logo ? `<img src="${home.team.logo}" class="team-logo">` : ''}
                  ${home.team.abbreviation} ${home.score || 0}
                  <span class="game-status">(${status})</span>
                  ${myPlayers.length ? `<span class="fantasy-players">★ ${myPlayers.map(p => escapeHtml(p.name.split(' ').slice(-1)[0])).join(', ')}</span>` : ''}
                </span>
              `;

              if (isNiners || isPhillies || isBlues) priorityGames.push(html);
              else standardGames.push(html);
            }
            // Handle Golf Leaderboards
            else if (league === 'PGA') {
              const leaders = comp.competitors?.slice(0, 3).map(c => `${c.athlete?.shortName || c.athlete?.displayName} (${c.score || 'E'})`).join(', ');
              if (leaders) {
                const html = `
                  <span class="ticker-item">
                    <span class="league-tag">[PGA]</span>
                    <span>${event.name}: ${leaders}</span>
                    <span class="game-status">(${status})</span>
                  </span>
                `;
                standardGames.push(html);
              }
            }
          });
        });

        const all = [...(fantasy?.items || []), ...priorityGames, ...standardGames];
        tickerEl.innerHTML = all.length ? all.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ') : 'No live scores available.';
      } catch (e) {
        tickerEl.innerText = 'Unable to load scores.';
      }
    }

    fetchScores();
    setInterval(fetchScores, 60000);
  </script>
</body>
</html>
