<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Sports Dashboard & Ticker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Embedded YouTube TV view supporting full login */
    .viewer-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
    }

    /* Top Control Bar */
    .top-controls {
      position: absolute;
      top: 10px;
      right: 15px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ctrl-btn {
      background: #aa0000;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }

    .ctrl-btn.secondary {
      background: #1e293b;
      border: 1px solid #475569;
    }

    /* Bottom Ticker Bar */
    .ticker-wrapper {
      height: 75px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      line-height: 75px;
      overflow: hidden;
      border-top: 4px solid #aa0000;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
      cursor: pointer;
    }

    .ticker-content {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding-left: 100%;
      animation: scroll-ticker 45s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      font-weight: 800;
      letter-spacing: 0.8px;
      font-size: 24px;
      padding: 0 16px;
    }

    /* 49ers Highlight Box */
    .ticker-item.niners-game {
      background: rgba(170, 0, 0, 0.45);
      border: 2px solid #B3995D;
      border-radius: 8px;
      padding: 4px 20px;
      margin: 0 10px;
    }

    .team-logo {
      height: 40px;
      width: 40px;
      object-fit: contain;
      vertical-align: middle;
      margin: 0 8px;
    }

    .league-tag {
      color: #94a3b8;
      font-size: 18px;
      font-weight: 800;
      margin-right: 10px;
    }

    .vs-text {
      color: #cbd5e1;
      font-weight: 500;
      margin: 0 8px;
    }

    .game-status {
      color: #38bdf8;
      font-weight: 600;
      font-size: 18px;
      margin-left: 12px;
    }

    @keyframes scroll-ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- Controls to jump to YouTube Login or Fullscreen -->
  <div class="top-controls">
    <button class="ctrl-btn" onclick="loadSource('https://tv.youtube.com')">YouTube TV / Sign In</button>
    <button class="ctrl-btn secondary" onclick="loadSource('https://www.youtube.com/tv')">YouTube TV App View</button>
    <button class="ctrl-btn secondary" onclick="toggleFullscreen()">Toggle Fullscreen</button>
  </div>

  <div class="app-viewport">
    <!-- Embedded player loaded directly to allow cookies & login context -->
    <iframe 
      id="mainFrame" 
      class="viewer-frame" 
      src="https://tv.youtube.com" 
      allow="fullscreen; autoplay; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>

    <!-- Scrolling Sports Ticker Bar -->
    <div class="ticker-wrapper" onclick="toggleFullscreen()">
      <div class="ticker-content" id="ticker">Loading live sports scores...</div>
    </div>
  </div>

  <script>
    function loadSource(url) {
      document.getElementById('mainFrame').src = url;
    }

    // ESPN Scores Script (NFL, MLB, NBA, NHL)
    const ENDPOINTS = [
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard'
    ];

    async function fetchAllScores() {
      const tickerEl = document.getElementById('ticker');
      try {
        const promises = ENDPOINTS.map(url => 
          fetch(url).then(res => res.ok ? res.json() : null).catch(() => null)
        );
        const results = await Promise.all(promises);
        let priorityItems = [], standardItems = [];

        results.forEach(data => {
          if (!data || !data.events) return;
          const league = data.leagues?.[0]?.abbreviation || 'SPORTS';

          data.events.forEach(event => {
            const comp = event.competitions?.[0];
            if (!comp) return;

            const home = comp.competitors?.find(c => c.homeAway === 'home');
            const away = comp.competitors?.find(c => c.homeAway === 'away');
            const status = event.status?.type?.shortDetail || 'Scheduled';

            if (home && away) {
              const homeScore = home.score !== undefined ? home.score : 0;
              const awayScore = away.score !== undefined ? away.score : 0;
              const homeLogo = home.team?.logo || '';
              const awayLogo = away.team?.logo || '';
              const isNiners = home.team?.abbreviation === 'SF' || away.team?.abbreviation === 'SF';

              const itemHTML = `
                <span class="ticker-item ${isNiners ? 'niners-game' : ''}">
                  <span class="league-tag">[${league}]</span>
                  ${awayLogo ? `<img src="${awayLogo}" class="team-logo">` : ''}
                  ${away.team.abbreviation} ${awayScore}
                  <span class="vs-text">@</span>
                  ${homeLogo ? `<img src="${homeLogo}" class="team-logo">` : ''}
                  ${home.team.abbreviation} ${homeScore}
                  <span class="game-status">(${status})</span>
                </span>
              `;

              if (isNiners) priorityItems.push(itemHTML);
              else standardItems.push(itemHTML);
            }
          });
        });

        const allItems = [...priorityItems, ...standardItems];
        tickerEl.innerHTML = allItems.length > 0 ? allItems.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ') : 'No games scheduled right now.';
      } catch (err) {
        tickerEl.innerText = 'Unable to connect to live ESPN score feed.';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    fetchAllScores();
    setInterval(fetchAllScores, 60000);
  </script>
</body>
</html>
