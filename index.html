<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Sports Overlay Ticker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      line-height: 48px;
      overflow: hidden;
      border-top: 3px solid #aa0000;
    }

    .ticker-content {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: scroll-ticker 35s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-size: 15px;
      padding: 0 8px;
    }

    /* 49ers Custom Gold & Red Highlight */
    .niners-highlight {
      background: rgba(170, 0, 0, 0.4);
      border: 1px solid #b3995d;
      border-radius: 6px;
      color: #ffdd00;
      box-shadow: 0 0 10px rgba(179, 153, 93, 0.5);
    }

    .team-logo {
      height: 22px;
      width: 22px;
      object-fit: contain;
      margin: 0 6px;
      vertical-align: middle;
    }

    .league-tag {
      color: #94a3b8;
      font-size: 12px;
      margin-right: 6px;
      text-transform: uppercase;
    }

    .status-tag {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
      margin-left: 6px;
    }

    @keyframes scroll-ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>
  <div class="ticker-wrapper">
    <div class="ticker-content" id="ticker">Loading live sports scores...</div>
  </div>

  <script>
    const ENDPOINTS = [
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard'
    ];

    async function fetchAllScores() {
      const tickerEl = document.getElementById('ticker');
      try {
        const promises = ENDPOINTS.map(url => 
          fetch(url)
            .then(res => res.ok ? res.json() : null)
            .catch(() => null)
        );
        const results = await Promise.all(promises);
        
        let allItems = [];

        results.forEach(data => {
          if (!data || !data.events) return;
          const league = data.leagues?.[0]?.abbreviation || 'SPORTS';

          data.events.forEach(event => {
            const comp = event.competitions?.[0];
            if (!comp) return;

            const home = comp.competitors?.find(c => c.homeAway === 'home');
            const away = comp.competitors?.find(c => c.homeAway === 'away');
            const status = event.status?.type?.shortDetail || 'Scheduled';

            if (home && away) {
              const homeAbbrev = home.team.abbreviation || '';
              const awayAbbrev = away.team.abbreviation || '';
              const homeScore = home.score !== undefined ? home.score : 0;
              const awayScore = away.score !== undefined ? away.score : 0;
              
              // Team Logo URLs from ESPN CDN
              const awayLogo = away.team.logo || `https://a.espncdn.com/i/teamlogos/nfl/500/${awayAbbrev.toLowerCase()}.png`;
              const homeLogo = home.team.logo || `https://a.espncdn.com/i/teamlogos/nfl/500/${homeAbbrev.toLowerCase()}.png`;

              // Check if 49ers are playing
              const isNiners = awayAbbrev === 'SF' || homeAbbrev === 'SF';
              const highlightClass = isNiners ? 'niners-highlight' : '';

              const itemHTML = `
                <span class="ticker-item ${highlightClass}">
                  <span class="league-tag">[${league}]</span>
                  <img src="${awayLogo}" class="team-logo" alt="${awayAbbrev}">
                  ${awayAbbrev} ${awayScore}
                  &nbsp;@&nbsp;
                  <img src="${homeLogo}" class="team-logo" alt="${homeAbbrev}">
                  ${homeAbbrev} ${homeScore}
                  <span class="status-tag">(${status})</span>
                </span>
              `;
              
              // Place 49ers game at the front of the ticker list
              if (isNiners) {
                allItems.unshift(itemHTML);
              } else {
                allItems.push(itemHTML);
              }
            }
          });
        });

        if (allItems.length > 0) {
          tickerEl.innerHTML = allItems.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ');
        } else {
          tickerEl.innerText = 'No active games scheduled for today.';
        }
      } catch (err) {
        tickerEl.innerText = 'Unable to connect to ESPN feed.';
      }
    }

    fetchAllScores();
    setInterval(fetchAllScores, 60000);
  </script>
</body>
</html>
