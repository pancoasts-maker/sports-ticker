<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Dashboard Ticker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }

    .app-viewport { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    /* Top Control & Nav Bar */
    .top-bar {
      height: 50px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #334155;
    }

    .nav-links { display: flex; gap: 12px; }

    .nav-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 600;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
    }

    .nav-btn.directv {
      background: #00A8E8;
      border-color: #00A8E8;
      color: #000;
      font-weight: 800;
    }

    /* Video Frame Container */
    .viewer-frame { flex: 1; width: 100%; border: none; background: #000; }

    /* Ticker Styling */
    .ticker-wrapper {
      height: 70px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      line-height: 70px;
      overflow: hidden;
      border-top: 4px solid #aa0000;
    }

    .ticker-content {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding-left: 100%;
      animation: scroll-ticker 55s linear infinite;
    }

    .ticker-item { display: inline-flex; align-items: center; font-weight: 800; font-size: 22px; padding: 0 16px; }

    /* Highlights */
    .niners-game { background: rgba(170, 0, 0, 0.45); border: 2px solid #B3995D; border-radius: 6px; margin: 0 8px; }
    .phillies-game { background: rgba(231, 15, 60, 0.35); border: 2px solid #E70F3C; border-radius: 6px; margin: 0 8px; }
    .blues-game { background: rgba(0, 47, 108, 0.55); border: 2px solid #FCB514; border-radius: 6px; margin: 0 8px; }

    .team-logo { height: 36px; width: 36px; margin: 0 8px; vertical-align: middle; }
    .league-tag { color: #94a3b8; font-size: 16px; margin-right: 8px; }
    .vs-text { color: #cbd5e1; margin: 0 6px; }
    .game-status { color: #38bdf8; font-size: 16px; margin-left: 10px; }

    @keyframes scroll-ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="top-bar">
      <div class="nav-links">
        <a href="https://stream.directv.com" target="_blank" class="nav-btn directv">Launch DIRECTV Stream ↗</a>
        <button class="nav-btn" onclick="loadStream('https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig')">YouTube Stream</button>
      </div>
    </div>

    <!-- Media Player -->
    <iframe id="mainFrame" class="viewer-frame" src="https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig" allowfullscreen></iframe>

    <!-- Live Ticker -->
    <div class="ticker-wrapper">
      <div class="ticker-content" id="ticker">Loading live sports scores...</div>
    </div>
  </div>

  <script>
    function loadStream(url) {
      document.getElementById('mainFrame').src = url;
    }

    const ENDPOINTS = [
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard'
    ];

    async function fetchScores() {
      const tickerEl = document.getElementById('ticker');
      try {
        const promises = ENDPOINTS.map(u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null));
        const data = await Promise.all(promises);

        let priority = [], standard = [];

        data.forEach(d => {
          if (!d || !d.events) return;
          const league = d.leagues?.[0]?.abbreviation || 'SPORTS';

          d.events.forEach(event => {
            const comp = event.competitions?.[0];
            if (!comp) return;

            const home = comp.competitors?.find(c => c.homeAway === 'home');
            const away = comp.competitors?.find(c => c.homeAway === 'away');
            const status = event.status?.type?.shortDetail || 'Scheduled';

            if (home && away) {
              const isNiners = (home.team?.abbreviation === 'SF' || away.team?.abbreviation === 'SF') && league === 'NFL';
              const isPhillies = (home.team?.abbreviation === 'PHI' || away.team?.abbreviation === 'PHI') && league === 'MLB';
              const isBlues = (home.team?.abbreviation === 'STL' || away.team?.abbreviation === 'STL') && league === 'NHL';

              let cls = '';
              if (isNiners) cls = 'niners-game';
              if (isPhillies) cls = 'phillies-game';
              if (isBlues) cls = 'blues-game';

              const html = `
                <span class="ticker-item ${cls}">
                  <span class="league-tag">[${league}]</span>
                  ${away.team?.logo ? `<img src="${away.team.logo}" class="team-logo">` : ''}
                  ${away.team.abbreviation} ${away.score || 0}
                  <span class="vs-text">@</span>
                  ${home.team?.logo ? `<img src="${home.team.logo}" class="team-logo">` : ''}
                  ${home.team.abbreviation} ${home.score || 0}
                  <span class="game-status">(${status})</span>
                </span>
              `;

              if (isNiners || isPhillies || isBlues) priority.push(html);
              else standard.push(html);
            }
          });
        });

        const all = [...priority, ...standard];
        tickerEl.innerHTML = all.length ? all.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ') : 'No live scores available.';
      } catch (e) {
        tickerEl.innerText = 'Unable to load live scores.';
      }
    }

    fetchScores();
    setInterval(fetchScores, 60000);
  </script>
</body>
</html>
