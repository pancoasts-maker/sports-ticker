<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Sports Overlay Ticker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      line-height: 48px;
      overflow: hidden;
      border-top: 2px solid #ef4444;
    }

    .ticker-content {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: scroll-ticker 35s linear infinite;
    }

    .ticker-item {
      font-weight: 700;
      letter-spacing: 0.5px;
      font-size: 16px;
    }

    @keyframes scroll-ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>
  <div class="ticker-wrapper">
    <div class="ticker-content" id="ticker">Loading live sports scores...</div>
  </div>

  <script>
    const ENDPOINTS = [
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard'
    ];

    async function fetchAllScores() {
      const tickerEl = document.getElementById('ticker');
      try {
        const promises = ENDPOINTS.map(url => 
          fetch(url)
            .then(res => res.ok ? res.json() : null)
            .catch(() => null)
        );
        const results = await Promise.all(promises);
        
        let allItems = [];

        results.forEach(data => {
          if (!data || !data.events) return;
          const league = data.leagues?.[0]?.abbreviation || 'SPORTS';

          data.events.forEach(event => {
            const comp = event.competitions?.[0];
            if (!comp) return;

            const home = comp.competitors?.find(c => c.homeAway === 'home');
            const away = comp.competitors?.find(c => c.homeAway === 'away');
            const status = event.status?.type?.shortDetail || 'Scheduled';

            if (home && away) {
              const homeScore = home.score !== undefined ? home.score : 0;
              const awayScore = away.score !== undefined ? away.score : 0;
              const itemText = `[${league}] ${away.team.abbreviation} ${awayScore} @ ${home.team.abbreviation} ${homeScore} (${status})`;
              allItems.push(itemText);
            }
          });
        });

        if (allItems.length > 0) {
          tickerEl.innerHTML = allItems.map(score => `<span class="ticker-item">${score}</span>`).join(' &nbsp;&nbsp;•&nbsp;&nbsp; ');
        } else {
          tickerEl.innerText = 'No active games scheduled for today.';
        }
      } catch (err) {
        tickerEl.innerText = 'Unable to connect to ESPN feed.';
      }
    }

    fetchAllScores();
    setInterval(fetchAllScores, 60000);
  </script>
</body>
</html>
</html>
