<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Sports YouTube & Overlay Ticker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* YouTube Container takes full height minus ticker */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh - 80px);
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating input bar to change YouTube Video/Live Stream ID or URL */
    .controls-overlay {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      gap: 8px;
    }

    .controls-overlay input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 14px;
      width: 240px;
    }

    .controls-overlay button {
      background: #aa0000;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Bottom Ticker Bar */
    .ticker-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      line-height: 80px;
      overflow: hidden;
      border-top: 4px solid #aa0000;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
      cursor: pointer;
    }

    .ticker-content {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding-left: 100%;
      animation: scroll-ticker 45s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      font-weight: 800;
      letter-spacing: 0.8px;
      font-size: 26px;
      padding: 0 16px;
    }

    /* 49ers Highlight */
    .ticker-item.niners-game {
      background: rgba(170, 0, 0, 0.45);
      border: 2px solid #B3995D;
      border-radius: 8px;
      padding: 4px 20px;
      margin: 0 10px;
    }

    .team-logo {
      height: 44px;
      width: 44px;
      object-fit: contain;
      vertical-align: middle;
      margin: 0 10px;
    }

    .league-tag {
      color: #94a3b8;
      font-size: 20px;
      font-weight: 800;
      margin-right: 10px;
    }

    .vs-text {
      color: #cbd5e1;
      font-weight: 500;
      margin: 0 8px;
    }

    .game-status {
      color: #38bdf8;
      font-weight: 600;
      font-size: 20px;
      margin-left: 12px;
    }

    @keyframes scroll-ticker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- Controls overlay to load YouTube URLs or IDs -->
  <div class="controls-overlay">
    <input type="text" id="ytUrlInput" placeholder="Paste YouTube Video URL or ID...">
    <button onclick="loadYouTubeVideo()">Load</button>
  </div>

  <!-- Top YouTube Container -->
  <div class="video-container">
    <iframe 
      id="ytPlayer" 
      src="https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHigh" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Bottom Ticker -->
  <div class="ticker-wrapper" onclick="toggleFullscreen()">
    <div class="ticker-content" id="ticker">Loading live sports scores...</div>
  </div>

  <script>
    function loadYouTubeVideo() {
      const input = document.getElementById('ytUrlInput').value.trim();
      if (!input) return;

      let videoId = input;
      if (input.includes('v=')) {
        videoId = input.split('v=')[1].split('&')[0];
      } else if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      }

      document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    }

    // ESPN Scores Script
    const ENDPOINTS = [
      'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
      'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard'
    ];

    async function fetchAllScores() {
      const tickerEl = document.getElementById('ticker');
      try {
        const promises = ENDPOINTS.map(url => 
          fetch(url).then(res => res.ok ? res.json() : null).catch(() => null)
        );
        const results = await Promise.all(promises);
        let priorityItems = [], standardItems = [];

        results.forEach(data => {
          if (!data || !data.events) return;
          const league = data.leagues?.[0]?.abbreviation || 'SPORTS';

          data.events.forEach(event => {
            const comp = event.competitions?.[0];
            if (!comp) return;

            const home = comp.competitors?.find(c => c.homeAway === 'home');
            const away = comp.competitors?.find(c => c.homeAway === 'away');
            const status = event.status?.type?.shortDetail || 'Scheduled';

            if (home && away) {
              const homeScore = home.score !== undefined ? home.score : 0;
              const awayScore = away.score !== undefined ? away.score : 0;
              const homeLogo = home.team?.logo || '';
              const awayLogo = away.team?.logo || '';
              const isNiners = home.team?.abbreviation === 'SF' || away.team?.abbreviation === 'SF';

              const itemHTML = `
                <span class="ticker-item ${isNiners ? 'niners-game' : ''}">
                  <span class="league-tag">[${league}]</span>
                  ${awayLogo ? `<img src="${awayLogo}" class="team-logo">` : ''}
                  ${away.team.abbreviation} ${awayScore}
                  <span class="vs-text">@</span>
                  ${homeLogo ? `<img src="${homeLogo}" class="team-logo">` : ''}
                  ${home.team.abbreviation} ${homeScore}
                  <span class="game-status">(${status})</span>
                </span>
              `;

              if (isNiners) priorityItems.push(itemHTML);
              else standardItems.push(itemHTML);
            }
          });
        });

        const allItems = [...priorityItems, ...standardItems];
        tickerEl.innerHTML = allItems.length > 0 ? allItems.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ') : 'No games today.';
      } catch (err) {
        tickerEl.innerText = 'Unable to connect to ESPN feed.';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    fetchAllScores();
    setInterval(fetchAllScores, 60000);
  </script>
</body>
</html>
